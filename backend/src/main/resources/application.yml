spring:
  application:
    name: mcreatik-live-gallery
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mcreatik}
    username: ${DATABASE_USERNAME:mcreatik}
    password: ${DATABASE_PASSWORD:mcreatik}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  mvc:
    async:
      request-timeout: -1
  servlet:
    multipart:
      # Dashboard uploads: one browser-made gallery JPEG (<= 8 MB) + thumbnail (<= 2 MB) per request.
      max-file-size: 10MB
      max-request-size: 12MB
      # Parts up to this size stay in memory: a guest's selfie (max 5 MB) is never written to disk, not even temporarily.
      file-size-threshold: 6MB

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

gallery:
  public-gallery-base-url: ${PUBLIC_GALLERY_BASE_URL:http://localhost:5173}
  api-public-base-url: ${API_PUBLIC_BASE_URL:http://localhost:8080}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:12h}
    bootstrap-admin-email: ${ADMIN_EMAIL:}
    bootstrap-admin-password: ${ADMIN_PASSWORD:}
  upload:
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:62914560}
    presign-ttl: ${UPLOAD_PRESIGN_TTL:15m}
    allowed-mime-types: image/jpeg,image/png
  uploader:
    online-threshold: ${UPLOADER_ONLINE_THRESHOLD:45s}
  processing:
    enabled: ${PROCESSING_ENABLED:true}
    workers: ${PROCESSING_WORKERS:2}
    max-attempts: 3
    stale-after: 5m
    optimized-long-edge: 2048
    optimized-quality: 0.85
    thumbnail-long-edge: 640
    thumbnail-quality: 0.78
  realtime:
    heartbeat-interval: 20s
    emitter-timeout: 30m
  rate-limit:
    public-capacity: ${PUBLIC_RATE_LIMIT_CAPACITY:600}
    public-refill-per-second: ${PUBLIC_RATE_LIMIT_REFILL:20}
  retention:
    default-days: ${RETENTION_DEFAULT_DAYS:90}
    purge-enabled: ${RETENTION_PURGE_ENABLED:true}
  face-search:
    # Global switch for "Find my photos" (an add-on per event). Off: nothing changes, no AWS calls.
    enabled: ${FACE_SEARCH_ENABLED:false}
    worker-enabled: ${FACE_INDEX_WORKER_ENABLED:true}
    region: ${AWS_REKOGNITION_REGION:ap-south-1}
    # An IAM user limited to Rekognition. Without keys the in-memory fake provider is used (demo/tests only).
    access-key-id: ${AWS_REKOGNITION_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_REKOGNITION_SECRET_ACCESS_KEY:}
    collection-prefix: ${FACE_COLLECTION_PREFIX:mck-prod}
    match-threshold: ${FACE_MATCH_THRESHOLD:90}
    ip-per-hour: ${FACE_SEARCH_IP_PER_HOUR:10}
    event-daily-cap: ${FACE_SEARCH_EVENT_DAILY_CAP:2000}
    max-attempts: 5
    max-faces-per-photo: 15
    max-matches: 100
  storage:
    type: ${STORAGE_TYPE:local}
    local:
      root: ${LOCAL_STORAGE_ROOT:./data/storage}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      originals-bucket: ${R2_ORIGINALS_BUCKET:mcreatik-instant-memories-originals}
      media-bucket: ${R2_MEDIA_BUCKET:mcreatik-instant-memories-media}
      media-public-base-url: ${R2_MEDIA_PUBLIC_BASE_URL:}
  mail:
    # Gmail / Google Workspace SMTP for "Forgot password" emails, sent from connect@mcreatik.com (app password).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:McreatiK <connect@mcreatik.com>}
    # Put in front of every outgoing subject; the beta server sets "[BETA] " so test mail is obvious. Empty = unchanged.
    subject-prefix: ${MAIL_SUBJECT_PREFIX:}
