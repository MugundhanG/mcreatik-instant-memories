# nginx site for the Instant Memories API. Put in /etc/nginx/sites-available/im-api.mcreatik.com,
# symlink into sites-enabled, `sudo nginx -t && sudo systemctl reload nginx`,
# then HTTPS: `sudo certbot --nginx -d im-api.mcreatik.com`.
server {
    listen 80;
    listen [::]:80;
    server_name im-api.mcreatik.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Live gallery uses Server-Sent Events: no buffering, long-lived connections.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
