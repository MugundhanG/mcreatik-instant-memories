name: Uploader installers

# Builds one-click installers for the McreatiK Instant Memories Uploader with Java bundled inside (studios install nothing else):
#   Windows .msi, macOS .dmg for Apple Silicon and for Intel.
# Pull requests that touch the uploader build them as downloadable artifacts (to check the build).
# A manual run (Actions → Uploader installers → Run workflow) on main, or a tag uploader-v1.2.3, publishes a GitHub
# release whose files keep the same names, so these links never change:
#   https://github.com/MugundhanG/mcreatik-instant-memories/releases/latest/download/McreatiK-Instant-Memories-Uploader-Windows.msi
#   https://github.com/MugundhanG/mcreatik-instant-memories/releases/latest/download/McreatiK-Instant-Memories-Uploader-Mac-AppleSilicon.dmg
#   https://github.com/MugundhanG/mcreatik-instant-memories/releases/latest/download/McreatiK-Instant-Memories-Uploader-Mac-Intel.dmg
# The installers are not code-signed yet: Windows SmartScreen and macOS Gatekeeper ask once (see the Uploader guide).
on:
  pull_request:
    paths: ["uploader/**", ".github/workflows/uploader-release.yml"]
  push:
    tags: ["uploader-v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Modules from `jdeps --print-module-deps`, plus TLS (jdk.crypto.ec), charsets and JMX for the FTP server.
  MODULES: java.base,java.desktop,java.logging,java.management,java.naming,java.net.http,java.security.jgss,java.security.sasl,java.sql,jdk.charsets,jdk.crypto.ec,jdk.unsupported

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: McreatiK-Instant-Memories-Uploader-Windows.msi
          - os: macos-14
            asset: McreatiK-Instant-Memories-Uploader-Mac-AppleSilicon.dmg
          - os: macos-15-intel
            asset: McreatiK-Instant-Memories-Uploader-Mac-Intel.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Version
        id: version
        shell: bash
        run: |
          # jpackage needs a plain numeric version whose first part is at least 1.
          if [[ "$GITHUB_REF" == refs/tags/uploader-v* ]]; then v="${GITHUB_REF#refs/tags/uploader-v}"; else v="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"

      - name: Build the uploader jar
        working-directory: uploader
        shell: bash
        run: |
          mvn -B -q package -DskipTests
          # Only the runnable jar goes into the app (not classes, test output or the shade plugin's original jar).
          mkdir -p ../pkg && cp target/mcreatik-uploader.jar ../pkg/

      - name: Windows installer (.msi)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # jpackage (JDK 21) builds MSIs with WiX 3.
          if ! command -v candle.exe >/dev/null 2>&1 && [[ ! -d "/c/Program Files (x86)/WiX Toolset v3.14/bin" ]]; then
            choco install wixtoolset --version 3.14.1 -y --no-progress
          fi
          export PATH="$PATH:/c/Program Files (x86)/WiX Toolset v3.14/bin"
          jpackage --type msi --dest dist --input pkg --main-jar mcreatik-uploader.jar \
            --main-class com.mcreatik.uploader.UploaderMain \
            --name "McreatiK Instant Memories Uploader" --app-version "${{ steps.version.outputs.value }}" \
            --vendor McreatiK --description "Sends camera photos to the McreatiK Instant Memories live gallery" \
            --icon uploader/packaging/icon.ico --add-modules "$MODULES" \
            --jlink-options "--strip-debug --no-header-files --no-man-pages" \
            --win-shortcut --win-menu --win-menu-group McreatiK --win-dir-chooser --win-per-user-install \
            --win-upgrade-uuid 6f3c2a8e-6b1e-4d6e-9a3c-1f7d6c5e2b41
          mv dist/*.msi "dist/${{ matrix.asset }}"

      - name: macOS installer (.dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p icon.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s uploader/packaging/icon.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s*2)); [ $d -le 1024 ] && sips -z $d $d uploader/packaging/icon.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          jpackage --type dmg --dest dist --input pkg --main-jar mcreatik-uploader.jar \
            --main-class com.mcreatik.uploader.UploaderMain \
            --name "McreatiK Instant Memories Uploader" --app-version "${{ steps.version.outputs.value }}" \
            --vendor McreatiK --description "Sends camera photos to the McreatiK Instant Memories live gallery" \
            --icon icon.icns --add-modules "$MODULES" \
            --jlink-options "--strip-debug --no-header-files --no-man-pages" \
            --mac-package-identifier com.mcreatik.uploader --mac-package-name "McreatiK Instant Memories Uploader"
          mv dist/*.dmg "dist/${{ matrix.asset }}"

      - name: Size
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/uploader-v') || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="uploader-v1.0.${GITHUB_RUN_NUMBER}"; fi
          gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "McreatiK Instant Memories Uploader ${tag#uploader-v}" \
            --notes "Installers with Java included. Windows: McreatiK-Instant-Memories-Uploader-Windows.msi. Mac: the AppleSilicon .dmg for M1–M4 Macs, the Intel .dmg for older Macs. Not code-signed yet: on first open, Windows → More info → Run anyway; Mac → System Settings → Privacy & Security → Open Anyway."
