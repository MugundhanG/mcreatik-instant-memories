name: Backend image

# Builds the backend Docker image and publishes it to GitHub Container Registry, so small servers
# can `docker pull` instead of compiling Java (deploy/oracle/deploy.sh with IMAGE=...).
on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mugundhang/mcreatik-instant-memories-backend:latest
            ghcr.io/mugundhang/mcreatik-instant-memories-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
