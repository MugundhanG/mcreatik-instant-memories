name: Backend image

# Builds the backend Docker image and publishes it to GitHub Container Registry, so small servers
# can `docker pull` instead of compiling Java (deploy/oracle/deploy.sh with IMAGE=...).
# main publishes :latest (production); beta publishes :beta (beta server). Both also get :sha-<commit>.
on:
  push:
    branches: [main, beta]
    paths: ["backend/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        run: |
          image=ghcr.io/mugundhang/mcreatik-instant-memories-backend
          if [ "$GITHUB_REF_NAME" = "main" ]; then channel=latest; else channel=beta; fi
          {
            echo "list<<EOF"
            echo "$image:$channel"
            echo "$image:sha-$GITHUB_SHA"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
