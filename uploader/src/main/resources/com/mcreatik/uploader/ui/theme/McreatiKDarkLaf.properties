# McreatiK Instant Memories Uploader: Dark theme. Same tokens as the Light theme (see McreatiKLightLaf.properties).

@background = #15171B
@foreground = #F3F4F6
@accentColor = #22C55E
@selectionBackground = #14532D
@selectionForeground = #F0FDF4

Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ProgressBar.arc = 999
Component.focusWidth = 1
Button.innerFocusWidth = 0
ScrollBar.showButtons = false
ScrollBar.thumbArc = 999
ScrollBar.width = 10
ScrollPane.smoothScrolling = true
TextField.background = #272B32
PasswordField.background = #272B32
ToolTip.background = #F3F4F6
ToolTip.foreground = #111827

