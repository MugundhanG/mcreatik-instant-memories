# McreatiK Instant Memories Uploader: Light theme (the default).
# Every colour the app uses is a token here (McK.*). The Dark theme defines the same tokens, so both themes share
# one set of components: nothing in the code holds a colour of its own.

@background = #FAFAFB
@foreground = #111827
@accentColor = #15803D
@selectionBackground = #DCFCE7
@selectionForeground = #14532D

Component.arc = 10
Button.arc = 10
TextComponent.arc = 10
CheckBox.arc = 6
ProgressBar.arc = 999
Component.focusWidth = 1
Button.innerFocusWidth = 0
ScrollBar.showButtons = false
ScrollBar.thumbArc = 999
ScrollBar.width = 10
ScrollPane.smoothScrolling = true
ToolTip.background = #111827
ToolTip.foreground = #FFFFFF

# --- surfaces ---
McK.bg = #FAFAFB
McK.sidebar = #F3F4F6
McK.header = #FFFFFF
McK.card = #FFFFFF
McK.inset = #F7F8FA
McK.border = #E5E7EB
McK.borderStrong = #D1D5DB
McK.hover = #E9EBEF
McK.selected = #FFFFFF
McK.segment = #FFFFFF
McK.shadow = #1018280F

# --- text ---
McK.text = #111827
McK.muted = #5F6673
McK.faint = #9CA3AF
McK.brand = #8A5A1C

# --- status (stroke/text, soft background, soft border) ---
McK.green = #15803D
McK.greenStrong = #16A34A
McK.greenSoft = #F0FDF4
McK.greenLine = #BBF7D0
McK.blue = #1D4ED8
McK.blueSoft = #EFF6FF
McK.blueLine = #BFDBFE
McK.amber = #B45309
McK.amberSoft = #FFFBEB
McK.amberLine = #FDE68A
McK.red = #B91C1C
McK.redSoft = #FEF2F2
McK.redLine = #FECACA
McK.grey = #5F6673
McK.greySoft = #F3F4F6
McK.greyLine = #E5E7EB

# --- buttons ---
McK.primary = #15803D
McK.primaryHover = #166534
McK.primaryPressed = #14532D
McK.primaryText = #FFFFFF
McK.secondary = #FFFFFF
McK.secondaryHover = #F3F4F6
McK.secondaryBorder = #D1D5DB
